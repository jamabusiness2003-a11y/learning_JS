<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="input-tasks">
        <label for="add-task">Add a Task</label>
        <input type="text" id="add-task" placeholder="Enter your task">
        <button id="btn">Add Task</button>
    </div>

    <div class="container-list">
        <ul id="to-do-list">
            <li class="list-item">
                <input type="checkbox" class="checkbox"> <span class="task-text">Drink a glass of water</span>
                <button class="btn-remove">Remove</button>
            </li>
            <li class="list-item">
                <input type="checkbox" class="checkbox"> <span class="task-text">Stretch for 2 minutes</span>
                <button class="btn-remove">Remove</button>
            </li>
            <li class="list-item">
                <input type="checkbox" class="checkbox"> <span class="task-text">Delete 10 old photos</span>
                <button class="btn-remove">Remove</button>
            </li>
            <li class="list-item">
                <input type="checkbox" class="checkbox"> <span class="task-text">Tidy one small surface</span>
                <button class="btn-remove">Remove</button>
            </li>
            <li class="list-item">
                <input type="checkbox" class="checkbox"> <span class="task-text">Write one sentence</span>
                <button class="btn-remove">Remove</button>
            </li>
            <li class="list-item">
                <input type="checkbox" class="checkbox"> <span class="task-text">Step outside briefly 🌿</span>
                <button class="btn-remove">Remove</button>
            </li>
        </ul>
    </div>

    <script src="optimized_script.js"></script>
</body>
</html>
